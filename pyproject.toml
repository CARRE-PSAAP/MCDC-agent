[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcdc-agent"
version = "0.1.0"
description = "AI Agent for MC/DC Neutron Transport Simulation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Gunnar Larsen, Alex Mote, Lizhong Chen" }
]
keywords = ["AI", "Agent", "MCDC", "Neutron Transport"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
]



dependencies = [
    "mcdc @ git+https://github.com/CEMeNT-PSAAP/MCDC.git@dev",
    "rich",
    "openai>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/CARRE-PSAAP/MCDC-agent"
Source = "https://github.com/CARRE-PSAAP/MCDC-agent"

[project.scripts]
mcdc-agent = "mcdc_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcdc_agent"]

[tool.hatch.metadata]
allow-direct-references = true
